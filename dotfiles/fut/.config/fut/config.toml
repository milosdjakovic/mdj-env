#:schema https://fut.sh/schemas/config.json

# fut, kept beside herdr rather than replacing it. This package is not in the stow list, so
# nothing here reaches the home directory until it is added there deliberately. What it is
# for, what it does better than herdr and the three things it cannot do at all are in
# decisions/fut-vs-herdr.md, and the Rejected section there is the part to read first.

[ui]
# herdr and tmux both sit on alt+z, and fut cannot. Its key grammar takes one printable
# character or ctrl and a letter and a few named keys, with no alt or meta modifier anywhere,
# so alt+z and alt-z are both refused outright. ctrl-z is the nearest free key that does not
# collide with either of the other two. Adopting fut for real means moving tmux as well.
prefix = "ctrl-z"
confirm_close = true

[ui.bindings]
# prefix+g is herdr's goto and prefix+space is its command palette, so both keep the finger
# they already have.
open_navigator = "g"
open_command_bar = "space"

# Every colour below is a palette slot rather than a hex value, which is the whole reason this
# module needs no theme-map and no emitter. Ghostty paints all 256 slots per half and repaints
# them on a theme switch, so these follow the appearance for free and nothing watches anything.
# Slots 16 to 19 are the four declared per half in dotfiles/ghostty/theme-map, already read by
# fzf, tmux and the Claude statusline. theme/CLAUDE.md has the contract.
#
# fut has no dark and light halves of its own and does not need them. A hex value written into
# any of these is the drift src/check-theme.sh exists to catch.
[ui.styles.normal]
foreground = "default"

[ui.styles.muted]
foreground = "index:17"

# The bar under the current row, the one neutral no ANSI slot can hold on both halves.
[ui.styles.current]
background = "index:16"

[ui.styles.selected]
background = "index:16"

[ui.styles.divider]
foreground = "index:18"

[ui.styles.session]
foreground = "blue"

[ui.styles.workspace]
foreground = "blue"

[ui.styles.tab]
foreground = "green"

[ui.styles.pane]
foreground = "index:17"

[ui.styles.attention]
foreground = "yellow"
add_modifiers = ["bold"]

[ui.styles.activity]
foreground = "green"

[ui.styles.error]
foreground = "red"

[ui.styles.added]
foreground = "green"

[ui.styles.deleted]
foreground = "red"

# The three popups, herdr's three tools on the same keys. A trusted command carries its own
# title, which is why these are three config blocks rather than a registered plugin. That
# plugin exists in the herdr module for one reason, a herdr keybinding popup has no title and
# only a plugin pane does.
#
# The scripts these name are not written yet. fut hands a popup no pane identity at all, only
# the calling pane's live working directory, so lazygit and lf port unchanged while the finder
# loses the ending that writes into the pane it was opened over. decisions/fut-vs-herdr.md
# carries the measurement and what each route costs.
#
# fut never inserts a shell, so program is an executable and args is a list. An inline command
# string, which is how the herdr bindings are written, has no equivalent here.
[trusted_commands.find]
title = "find a folder or file under home"
binding = "f"
program = "~/.config/fut/tools/find.sh"

[trusted_commands.git]
title = "lazygit here, or pick a recent repository"
binding = "G"
program = "~/.config/fut/tools/lazygit.sh"

[trusted_commands.browse]
title = "browse files with lf"
binding = "b"
program = "~/.config/fut/tools/browse.sh"
