# Aura Dark for kitty, the upstream file from packages/kitty/aura-theme.conf, copied
# unchanged. The copy that used to sit here had been hand edited away from it.
#
# Two things about this file are upstream's own and worth knowing. Its background is
# #21202e and its black is #1c1b22, which are the soft dark values, even though nothing in
# the name says soft, so this is not the same paper as the Ghostty aura-dark theme. And
# like the Alacritty package it repeats purple across blue and magenta and green across
# green and cyan, so pink #f694ff and blue #82e2ff appear nowhere in the sixteen.

# special
active_border_color     #edecee
inactive_border_color   #21202e
bell_border_color       #ffca85
url_color               #61ffca

active_tab_foreground   #edecee
active_tab_background   #21202e
inactive_tab_foreground #4d4d4d
inactive_tab_background #21202e

cursor                  #edecee
foreground              #edecee
background              #21202e
selection_foreground    #edecee
selection_background    #1c1b22

