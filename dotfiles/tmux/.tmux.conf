# ============================================
# CORE SETTINGS
# ============================================
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g renumber-windows on
setw -g mode-keys vi

# Copy mode scrolling (vi mode)
bind-key -T copy-mode-vi J send-keys -X halfpage-down
bind-key -T copy-mode-vi K send-keys -X halfpage-up
bind-key -T copy-mode-vi C-j send-keys -X page-down
bind-key -T copy-mode-vi C-k send-keys -X page-up

set -g @yank_action "copy-pipe"

# Override tmux-sensible's escape-time (10ms) to 0 for instant Escape
# handling. Matters especially for nested popups where the delay compounds.
set -s escape-time 0

# Allow passthrough for terminal apps like yazi (image preview, terminal detection)
set -g allow-passthrough all

# Keep TERM and TERM_PROGRAM refreshed from the connecting client so the
# terminal type is always correct after attach. set -gu removes all existing
# entries first to prevent duplicates from accumulating on every reload.
set -gu update-environment FZF_DEFAULT_OPTS
set -gu update-environment TERM
set -gu update-environment TERM_PROGRAM
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Popup border tinted with the same #949494 used for fzf border, info,
# header, scrollbar, and gutter, so the tmux frame visually matches the
# fzf chrome rendered inside it.
set -g popup-border-style "fg=#949494"

# fzf colors mapped to ANSI palette (see dotfiles/zsh/.zshrc.custom).
# Declared at the tmux level so display-popup spawns inherit it without
# depending on attach-time client env. Keep in sync with the zshrc export.
# update-environment is intentionally NOT used here: it would overwrite the
# value from a stale client zsh on every reattach, so the value stays sticky
# from set-environment plus a setenv fired at config load to also reach the
# current session env (set-environment -g alone only seeds new sessions).
set-environment -g FZF_DEFAULT_OPTS "--color=fg:-1,bg:-1,fg+:-1,bg+:-1 --color=hl:2,hl+:10 --color=prompt:2,pointer:2,marker:3,spinner:3 --color=info:#949494,header:#949494,border:#949494 --color=separator:#949494,scrollbar:#949494,gutter:#15141b"
set-environment FZF_DEFAULT_OPTS "--color=fg:-1,bg:-1,fg+:-1,bg+:-1 --color=hl:2,hl+:10 --color=prompt:2,pointer:2,marker:3,spinner:3 --color=info:#949494,header:#949494,border:#949494 --color=separator:#949494,scrollbar:#949494,gutter:#15141b"

# Prefix: Ctrl + `
unbind C-b
set-option -g prefix 'M-z'
set-option -g prefix2 'M-Z'
bind 'M-z' send-prefix

set -g status-right ""

# ============================================
# PREFIX BINDINGS
# ============================================

# Command palette launcher
bind -N "[p:0] Launcher (command palette)" Space display-popup -w 80 -h 70% -E "PANE_PATH='#{pane_current_path}' ~/.tmux/scripts/fzf-launcher.sh"

