# # Traditional choose-tree for windows
# bind W choose-tree -w

# # Panes (across all sessions)
# bind f display-popup -w 80 -h 70% -E "tmux list-panes -a -F '#{session_name}:#{window_index}.#{pane_index} - #{window_name}: #{pane_current_command}' | fzf --reverse | cut -d' ' -f1 | xargs tmux switch-client -t"

# # General choose-tree (shows everything: sessions, windows, panes)
# bind F choose-tree

# FZF session switcher with last attached session highlighted
bind -N "[p:7] Sessions (fzf switcher)" s display-popup -w 52 -h 70% -E "PANE_PATH='#{pane_current_path}' ~/.tmux/scripts/fzf-sessions.sh"

# Traditional choose-tree for sessions (visual, hierarchical)
bind -N "[p:10] Sessions (tree view)" S choose-tree -Zs

# Search the file explorer's tags. Inside the popup: <enter> copies, ^v opens
# in nvim inline, alt-v opens in a new tmux window.
bind -N "[p:35] Search explorer tags (copy / nvim here / nvim new window)" t \
  display-popup -w 80% -h 80% -E "~/.tmux/scripts/fzf-tags.sh"

bind -N "[p:36] Find files globally (copy / nvim here / nvim new window)" f \
  display-popup -d "$HOME" -w 80% -h 80% -E "~/.tmux/scripts/fzf-files.sh"

bind -N "[p:37] Find files (copy / nvim here / nvim new window)" F \
  display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "~/.tmux/scripts/fzf-files.sh"

# Session switching
bind -N "[p:6] Switch to last session" e switch-client -l
bind -N "[p:13] Switch to previous session" ( switch-client -p
bind -N "[p:14] Switch to next session" ) switch-client -n

# Jump to a session by the number the second status row shows beside it, the way
# prefix plus a bare number already jumps to a window. Nine sibling bindings share
# one priority because they are one feature and belong together in the cheat sheet.
# The client is passed in because the script runs in the background, where a
# switch-client with no client would move whichever terminal was used last.
bind -N "[p:11] Jump to session 1" M-1 run-shell -b "~/.tmux/scripts/session-index.sh --switch 1 '#{client_name}'"
bind -N "[p:11] Jump to session 2" M-2 run-shell -b "~/.tmux/scripts/session-index.sh --switch 2 '#{client_name}'"
bind -N "[p:11] Jump to session 3" M-3 run-shell -b "~/.tmux/scripts/session-index.sh --switch 3 '#{client_name}'"
bind -N "[p:11] Jump to session 4" M-4 run-shell -b "~/.tmux/scripts/session-index.sh --switch 4 '#{client_name}'"
bind -N "[p:11] Jump to session 5" M-5 run-shell -b "~/.tmux/scripts/session-index.sh --switch 5 '#{client_name}'"
bind -N "[p:11] Jump to session 6" M-6 run-shell -b "~/.tmux/scripts/session-index.sh --switch 6 '#{client_name}'"
bind -N "[p:11] Jump to session 7" M-7 run-shell -b "~/.tmux/scripts/session-index.sh --switch 7 '#{client_name}'"
bind -N "[p:11] Jump to session 8" M-8 run-shell -b "~/.tmux/scripts/session-index.sh --switch 8 '#{client_name}'"
bind -N "[p:11] Jump to session 9" M-9 run-shell -b "~/.tmux/scripts/session-index.sh --switch 9 '#{client_name}'"

# Windows
bind -N "[p:5] Switch to last window" a last-window
bind -N "[p:15] Previous window" p previous-window
bind -N "[p:16] Next window" n next-window
bind -N "[p:19] Swap window left" P swap-window -t -1\; select-window -t -1
bind -N "[p:20] Swap window right" N swap-window -t +1\; select-window -t +1

# Panes - navigation
bind -N "[p:21] Select pane left" h select-pane -L
bind -N "[p:22] Select pane down" j select-pane -D
bind -N "[p:23] Select pane up" k select-pane -U
bind -N "[p:24] Select pane right" l select-pane -R
bind -N "[p:18] Next pane" o select-pane -t :.+
bind -N "[p:17] Previous pane" O select-pane -t :.-

# Panes - resizing
bind -N "[p:25] Resize pane left by 2" -r H resize-pane -L 2
bind -N "[p:26] Resize pane down by 2" -r J resize-pane -D 2
bind -N "[p:27] Resize pane up by 2" -r K resize-pane -U 2
bind -N "[p:28] Resize pane right by 2" -r L resize-pane -R 2

# Panes - zoom
bind -N "[p:29] Zoom/unzoom pane" z resize-pane -Z

# Lazygit floating pane
bind -N "[p:3] Lazygit popup" g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

# Lazygit popup but pick a recent repo or worktree first
# Source: lazygit state.yml recentrepos, augmented with `git worktree list`
bind -N "[p:8] Recent repos & worktrees lazygit" G run-shell -b "~/.tmux/scripts/fzf-recent-repos.sh"

# Filesystem scan of all repos under $HOME with worktrees nested underneath.
# Inside the popup: <enter>/^g lazygit, ^p path, ^b branch, ^n name.
bind -N "[p:9] Repos & worktrees picker" r run-shell -b "~/.tmux/scripts/fzf-repos.sh"

# File explorer floating pane
# Which explorer this is lives in ~/.tmux/scripts/explorer.sh, which also
# decides whether it needs wrapping in a nested tmux session so its
# sub-commands can open their own popups.
bind -N "[p:4] File explorer popup" b display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "~/.tmux/scripts/explorer.sh --open"

# Scratch shell popup
bind -N "[p:34] Scratch shell popup" '`' display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "$SHELL"

# Splits & new windows
bind -N "[p:30] Split pane horizontally" '"' split-window -c "#{pane_current_path}"
bind -N "[p:31] Split pane vertically" % split-window -h -c "#{pane_current_path}"
bind -N "[p:32] New window" c new-window -c "#{pane_current_path}"

# Tmux management menu (save/restore/reload)
bind -N "[p:2] Tmux management (save, restore, reload)" M display-popup -w 80 -h 70% -E "~/.tmux/scripts/fzf-manage.sh"

# Keybindings cheat sheet
bind -N "[p:33] Show all keybindings" ? display-popup -w 80 -h 70% -E "~/.tmux/scripts/fzf-keys.sh"

# ============================================
# PLUGINS
# ============================================
set -g @continuum-restore 'on'
set -g @resurrect-hook-pre-restore-pane-processes 'tmux switch-client -n && tmux kill-session -t=0'

TMUX_FZF_LAUNCH_KEY="m"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

# Continuum wires up auto-save by prepending a save-trigger to status-right
# when tpm loads it. So status-right must be set here, before tpm runs —
# setting it afterwards overwrites the trigger and silently disables auto-save.
set -g status-right '#{continuum_status}#{?@copy_mode, [COPY] press q to exit ,#{?client_prefix, ⌨️ ,}}'

run-shell "$(brew --prefix tpm)/share/tpm/tpm"

# Re-bind plugin keys with -N descriptions so they appear in the ? cheat sheet
bind -N "[p:1] Tmux actions (tmux-fzf)" m run-shell -b ~/.tmux/plugins/tmux-fzf/main.sh
bind -N "Install plugins (tpm)" I run-shell "$(brew --prefix tpm)/share/tpm/bindings/install_plugins"
bind -N "Update plugins (tpm)" U run-shell "$(brew --prefix tpm)/share/tpm/bindings/update_plugins"
bind -N "Remove unused plugins (tpm)" M-u run-shell "$(brew --prefix tpm)/share/tpm/bindings/clean_plugins"
bind -N "Reload tmux config (sensible)" R run-shell "tmux source-file ~/.tmux.conf > /dev/null; tmux display-message 'Config reloaded'"
bind -N "Yank current command line (yank)" y run-shell -b ~/.tmux/plugins/tmux-yank/scripts/copy_line.sh
bind -N "Copy pane working directory (yank)" Y run-shell -b ~/.tmux/plugins/tmux-yank/scripts/copy_pane_pwd.sh
bind -N "Save environment (resurrect)" C-s run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh
bind -N "Restore environment (resurrect)" C-r run-shell ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh

# ============================================
# STATUS BAR
# ============================================

# # Reset to defaults first
# set -gu status-left
# set -gu status-left-length
# set -gu status-right
# set -gu window-status-current-style
# set -gu window-status-current-format
# set -gu window-status-last-style
# set -gu window-status-format
# set -gu window-status-style

# ============================================

# Track copy mode as a global variable (pane_in_mode only works for the
# evaluated pane, so non-active windows can't see it — this hook propagates
# the active pane's mode to a global @copy_mode flag).
set -g @copy_mode 0
set-hook -g pane-mode-changed       'set -gF @copy_mode "#{pane_in_mode}"'
set-hook -g pane-focus-in           'set -gF @copy_mode "#{pane_in_mode}"'
set-hook -g session-window-changed  'set -gF @copy_mode "#{pane_in_mode}"'
set-hook -g client-session-changed  'set -gF @copy_mode "#{pane_in_mode}"'

# Transparent by default, green when prefix active, yellow when in copy mode
set -g status-style '#{?@copy_mode,bg=yellow fg=black,#{?client_prefix,bg=green fg=black,bg=default fg=default}}'

# Two names for what the line above implies, so the rest of the bar can say it once each
# time instead of repeating the same nested conditional. @bar_muted is true whenever the
# bar has taken a background colour, which is the moment every foreground on it has to go
# black to stay readable. @bar_dim is the quiet grey for chrome and for anything the eye
# should skip, and it is colour246 rather than the hex #949494 it equals because a hex
# value loses its # when read back through a second expansion. That grey is the same one
# the fzf popups use for their borders and headers.
#
# Read either back with #{E:...}, since an option value is otherwise handed over literally.
set -g @bar_muted '#{?@copy_mode,1,#{?client_prefix,1,0}}'
set -g @bar_dim   '#{?#{E:@bar_muted},black,colour246}'

# A W label rather than the session name that used to sit here, since the row below
# names every session including the current one and printing it twice said nothing. The
# label pairs with the S on that row, so both lists start at the same column and neither
# row can be mistaken for the other. It is styled through status-left-style rather than
# with an inline tag because the default row 0 format truncates status-left to
# status-left-length, and a style tag inside the value would eat that budget.
set -g status-left ' W '
set -g status-left-style '#{?#{E:@bar_muted},fg=black,fg=colour246}'

# Indicator: copy mode > prefix > nothing.
# status-right is defined above (before tpm) so continuum's auto-save survives.

# Current window - with zoom indicator
set -g window-status-current-style 'fg=green'
set -g window-status-current-format "#{?@copy_mode,#[fg=black]>#I:#W#{?window_zoomed_flag, 🔍,}<,#{?client_prefix,#[fg=black]>#I:#W#{?window_zoomed_flag, 🔍,}<,>#I:#W#{?window_zoomed_flag, 🔍,}<}}"

# Last window - white normally, black when prefix/copy mode pressed
set -g window-status-last-style '#{?@copy_mode,fg=black,#{?client_prefix,fg=black,fg=white}}'

# Other windows - zoom indicator
set -g window-status-format "#{?#{m:*-*,#{window_flags}},-#I:#W#{?window_zoomed_flag, 🔍,},#I:#W#{?window_zoomed_flag, 🔍,}}"
set -g window-status-style '#{?@copy_mode,fg=black,fg=default}'

# ============================================
# SESSION STRIP (second status row)
# ============================================

# A second status row under the window list, showing every session with the number
# that jumps to it. Row 0 is deliberately left at its default so everything set above
# for the window line keeps working, and only row 1 is written here.
set -g status 2

# The number is read from @sidx, stamped on each session by session-index.sh, so this
# row and the M-1 bindings read one stored value instead of deriving the same order
# twice. Reading a session option keeps the row a pure format with no shell in the
# redraw path, which is why the numbers change the moment a session does rather than
# on a poll.
#
# Three levels of emphasis carry the whole row. The current session is wrapped in angle
# brackets and green, the one prefix+e goes back to carries a leading dash and is white,
# and every other session is dim. Windows and sessions render in the same N:name shape,
# so brightness is what stops the two rows reading as one list of ten things. The dim
# also settles which row the eye lands on, and it should be the window row, since that
# is the one switched constantly.
#
# The far right says ⌥1-9 rather than naming the row, because the S label already says
# what this is and the question in the moment is which key to press.
#
# Each entry is wrapped in a session range so a click switches to it, the same as
# clicking a window on the row above. That works without a new binding because the
# default MouseDown1Status is already switch-client -t = and a session range hands it
# the session as the target. The range takes a session id rather than a name, which is
# also what keeps it safe, since the user range that would otherwise fit here caps its
# argument at 15 bytes and a longer session name would not survive. The separating
# space sits outside the range so the gap between two entries is not clickable.
set -g status-format[1] '#[align=left]#[fg=#{E:@bar_dim}] S #[default]#{S:#[range=session|#{session_id}]#{?#{==:#{E:client_session},#{session_name}},#[fg=#{?#{E:@bar_muted},black,green}]>#{@sidx}:#{session_name}<#[default],#{?#{==:#{E:client_last_session},#{session_name}},#[fg=#{?#{E:@bar_muted},black,white}]-#{@sidx}:#{session_name}#[default],#[fg=#{E:@bar_dim}]#{@sidx}:#{session_name}#[default]}}#[norange] }#[align=right]#[fg=#{E:@bar_dim}]⌥1-9 #[default]'

# Numbering shifts whenever the set of sessions changes, so restamp on the three events
# that can change it. A rename counts, because the order is by name.
set-hook -g session-created      'run-shell -b "~/.tmux/scripts/session-index.sh --renumber"'
set-hook -g session-closed       'run-shell -b "~/.tmux/scripts/session-index.sh --renumber"'
set-hook -g after-rename-session 'run-shell -b "~/.tmux/scripts/session-index.sh --renumber"'

# Stamp whatever is already running, since the hooks above only see changes from here on.
run-shell -b "~/.tmux/scripts/session-index.sh --renumber"
