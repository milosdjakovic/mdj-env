# FZF session switcher with last attached session highlighted
bind -N "Sessions (fzf switcher)" s display-popup -w 80 -h 70% -E "\
  tmux list-sessions -F '#{session_last_attached} #{session_name}' | \
  sort -r | \
  cut -d' ' -f2- | \
  grep -v \"^$(tmux display-message -p '#S')\$\" | \
  fzf --reverse \
      --header=\"Sessions | Current: $(tmux display-message -p '#S')\" \
      --header-first | \
  xargs tmux switch-client -t"

# Traditional choose-tree for sessions (visual, hierarchical)
bind -N "Sessions (tree view)" S choose-tree -Zs

# FZF windows switcher (sorted by last used, current excluded)
bind -N "Windows (fzf switcher)" w display-popup -w 80 -h 70% -E "\
  tmux list-windows -a -F '#{window_activity} #{session_name}:#{window_index} - #{window_name}' | \
  sort -r | \
  cut -d' ' -f2- | \
  grep -v \"^$(tmux display-message -p '#S:#I')\s\" | \
  fzf --reverse \
      --header=\"Windows | Current: $(tmux display-message -p '#S:#I - #W')\" \
      --header-first | \
  cut -d' ' -f1 | \
  xargs tmux switch-client -t"

# Traditional choose-tree for windows
bind -N "Windows (tree view)" W choose-tree -Zw

# FZF panes switcher (sorted by last used, current excluded)
bind -N "Panes (fzf switcher)" f display-popup -w 80 -h 70% -E "\
  tmux list-panes -a -F '#{pane_last_used} #{session_name}:#{window_index}.#{pane_index} - #{window_name}: #{pane_current_command}' | \
  sort -r | \
  cut -d' ' -f2- | \
  grep -v \"^$(tmux display-message -p '#S:#I.#P')\s\" | \
  fzf --reverse \
      --header=\"Panes | Current: $(tmux display-message -p '#S:#I.#P - #W')\" \
      --header-first | \
  cut -d' ' -f1 | \
  xargs tmux switch-client -t"

# General choose-tree (shows everything: sessions, windows, panes)
bind -N "Choose tree (all sessions, windows, panes)" F choose-tree -Z

# Session switching
bind -N "Switch to last session" e switch-client -l
bind -N "Switch to previous session" ( switch-client -p
bind -N "Switch to next session" ) switch-client -n

# Windows
bind -N "Switch to last window" a last-window
bind -N "Previous window" p previous-window
bind -N "Next window" n next-window
bind -N "Swap window left" P swap-window -t -1\; select-window -t -1
bind -N "Swap window right" N swap-window -t +1\; select-window -t +1

# Panes - navigation
bind -N "Select pane left" h select-pane -L
bind -N "Select pane down" j select-pane -D
bind -N "Select pane up" k select-pane -U
bind -N "Select pane right" l select-pane -R
bind -N "Next pane" o select-pane -t :.+
bind -N "Previous pane" O select-pane -t :.-

# Panes - resizing
bind -N "Resize pane left by 2" -r H resize-pane -L 2
bind -N "Resize pane down by 2" -r J resize-pane -D 2
bind -N "Resize pane up by 2" -r K resize-pane -U 2
bind -N "Resize pane right by 2" -r L resize-pane -R 2

# Panes - zoom
bind -N "Zoom/unzoom pane" z resize-pane -Z

# Lazygit floating pane
bind -N "Lazygit popup" g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

# Splits & new windows
bind -N "Split pane horizontally" '"' split-window -c "#{pane_current_path}"
bind -N "Split pane vertically" % split-window -h -c "#{pane_current_path}"
bind -N "New window" c new-window -c "#{pane_current_path}"

# Tmux management menu (save/restore/reload)
bind -N "Tmux management (save, restore, reload)" M display-popup -w 80 -h 70% -E "\
  printf 'Save Session\nRestore Session\nReload Config\n' | \
  fzf --reverse \
      --header=\"Tmux Management\" \
      --header-first | \
  xargs -I{} sh -c '\
    case \"{}\" in \
      Save*) ~/.tmux/plugins/tmux-resurrect/scripts/save.sh ;; \
      Restore*) ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh ;; \
      Reload*) tmux source-file ~/.tmux.conf \\; display-message \"Config reloaded\" ;; \
    esac'"

# Keybindings cheat sheet
bind -N "Show all keybindings" ? display-popup -w 80 -h 70% -E "\
  tmux list-keys -N -T prefix | \
  fzf --reverse \
      --header=\"Keybindings | prefix = Alt-z\" \
      --header-first"

# ============================================
# PLUGINS
# ============================================
set -g @continuum-restore 'on'
set -g @resurrect-hook-pre-restore-pane-processes 'tmux switch-client -n && tmux kill-session -t=0'

TMUX_FZF_LAUNCH_KEY="m"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

run-shell "$(brew --prefix tpm)/share/tpm/tpm"

bind -N "Tmux actions (tmux-fzf plugin)" m run-shell -b ~/.tmux/plugins/tmux-fzf/main.sh

