# ============================================
# CORE SETTINGS
# ============================================
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g renumber-windows on
setw -g mode-keys vi

set -g @yank_action "copy-pipe"

# Prefix: Ctrl + `
unbind C-b
set-option -g prefix 'M-z'
set-option -g prefix2 'M-Z'
bind 'M-z' send-prefix

set -g status-right ""

