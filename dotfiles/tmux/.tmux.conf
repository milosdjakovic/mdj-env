# ============================================

# Track copy mode as a global variable (pane_in_mode only works for the
# evaluated pane, so non-active windows can't see it — this hook propagates
# the active pane's mode to a global @copy_mode flag).
set -g @copy_mode 0
set-hook -g pane-mode-changed       'set -gF @copy_mode "#{pane_in_mode}"'
set-hook -g pane-focus-in           'set -gF @copy_mode "#{pane_in_mode}"'
set-hook -g session-window-changed  'set -gF @copy_mode "#{pane_in_mode}"'
set-hook -g client-session-changed  'set -gF @copy_mode "#{pane_in_mode}"'

# Transparent by default, green when prefix active, yellow when in copy mode
set -g status-style '#{?@copy_mode,bg=yellow fg=black,#{?client_prefix,bg=green fg=black,bg=default fg=default}}'

# Session name on left
set -g status-left '[#S] '
set -g status-left-length 20

# Indicator: copy mode > prefix > nothing.
# status-right is defined above (before tpm) so continuum's auto-save survives.

# Current window - with zoom indicator
set -g window-status-current-style 'fg=green'
set -g window-status-current-format "#{?@copy_mode,#[fg=black]>#I:#W#{?window_zoomed_flag, 🔍,}<,#{?client_prefix,#[fg=black]>#I:#W#{?window_zoomed_flag, 🔍,}<,>#I:#W#{?window_zoomed_flag, 🔍,}<}}"

# Last window - white normally, black when prefix/copy mode pressed
set -g window-status-last-style '#{?@copy_mode,fg=black,#{?client_prefix,fg=black,fg=white}}'

# Other windows - zoom indicator
set -g window-status-format "#{?#{m:*-*,#{window_flags}},-#I:#W#{?window_zoomed_flag, 🔍,},#I:#W#{?window_zoomed_flag, 🔍,}}"
set -g window-status-style '#{?@copy_mode,fg=black,fg=default}'
