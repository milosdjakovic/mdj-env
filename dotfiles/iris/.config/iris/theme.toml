# iris colours. Ghostty owns the palette and this file inherits it twice over, once by writing
# every colour it can as an ANSI slot rather than a hex value, and once by letting the two
# tables at the bottom answer for the things a slot cannot carry.
#
# Slots work because lipgloss v2 turns "4" into ansi.BasicColor(4), which goes out as SGR 34
# and lands on the terminal's own slot 4. An earlier version of this file claimed otherwise,
# on the strength of a measurement that only looked for 38;2 and 38;5 sequences and never at
# the 30 to 37 range, so it saw nothing while the menu was drawing in palette colours the
# whole time. Slots are worth using because aura-dark and aura-light mirror each other by
# role, so slot 4 is the primary accent on both and slot 8 is the comment grey on both. Change
# the Ghostty theme and this follows with no edit here.
#
# The [dark] and [light] tables need the fork. Stock iris has one flat set of keys and no idea
# what the terminal is painting, which is fine for anything drawn on the page and impossible
# for the selection bar, since a bar has to be a tint of the page under it and no slot is dark
# on the dark palette and light on the light one. See src/build-iris.sh.

# --- drawn on the terminal background, so the palette answers for them ---
border = "4"
key = "4"
scroll_info = "4"
muted = "8"
desc = "8"

# Aura publishes one grey and gives it to comments, which is slot 8's job in a terminal and
# ghost text's job here. Quiet on purpose, 3.54 to 1 on dark and 3.92 on light.
ghost_text = "8"

# Not colours at all. lipgloss renders an unparseable value unstyled, so a foreground inherits
# whatever the terminal is painting, and it does not draw an unparseable background at all.
# The second half is what leaves a tag as a word on the page rather than a chip stamped onto
# it, which is what the dark blocks on a white page used to be.
text = "terminal-default"
alias = "terminal-default"
hist = "terminal-default"
sys = "terminal-default"

# These read twice, as the tag colour on an ordinary row and as the tag's background once the
# row is selected, so each has to work both ways. Slot 4 and slot 2 do.
alias_sel = "4"
hist_sel = "2"
sys_sel = "4"

# --- on the selected row, which is the only place a slot cannot answer alone ---
accent = "2"
match = "3"

# The two tables below are generated by theme-emit and must not be edited by hand. The bar
# is the highlight role, the same bar herdr's navigate row carries, and the
# secondary text is the subtext role, so the surfaces agree rather than each inventing a
# highlight. Which key takes which role is dotfiles/iris/theme-map, with the reasons.
[dark]
# Generated by theme-emit, do not edit these two tables. They are written from
# theme/palettes through dotfiles/iris/theme-map by src/check-theme.sh, mode system.
# Change a colour in the palette or a role in the map and run the checker. Everything
# above the tables is written by hand and the generator copies it through.
desc_sel = "#cdccce"
sel_bg = "#3a2e56"
sel_text = "#15141b"
text_sel = "#edecee"

[light]
desc_sel = "#5c5a6a"
sel_bg = "#dcdbe1"
sel_text = "#f8f7fb"
text_sel = "#474556"
