onboarding = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false

status_indicators = "symbols"
[ui.toast]
delivery = "herdr"

# Two entries in the default agent layout carry a dim flag, and dim here is the terminal's
# own faint attribute rather than a colour. herdr is a ratatui program and its binary carries
# crossterm's literal SGR 2, so the faded text is the same colour drawn at Ghostty's
# faint-opacity, which is why no value set on any token could ever level it.
#
# The two are the agent name on the second row and the tab name on the first. Both read
# overlay0 and both sat lighter than the git branch under spaces, which reads the same token
# undimmed. Which entry was the faded one on the first row came from herdr api snapshot rather
# than from looking, since the row is state_icon, machine, workspace, tab, machine is blank on
# a local agent, and the snapshot shows the bold half is the workspace label and the faded half
# is the tab label.
#
# Only the agents rows are restated. The spaces rows keep their default, so the lines being
# matched to are untouched.
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", { token = "tab", dim = false }],
  [{ token = "agent", dim = false }],
]

[theme]
# Aura, expressed in herdr's own tokens. herdr's eighteen built in themes are compiled into
# the binary and there is no way to add a nineteenth, so a theme here is a full override set
# rather than a file, and the base stays terminal so anything not named below still falls
# back to the palette Ghostty is painting.
#
# The two tables below are generated by theme-emit and must not be edited by hand. The
# colours come from theme/palettes at the repository root, and which token takes which role
# is dotfiles/herdr/theme-map, which also carries the reasons. Change a colour there and run
# src/check-theme.sh. Everything else in this file is written by hand.
#
# The finding that made this possible. herdr's token names are Catppuccin's palette
# vocabulary, surface0, surface1, overlay0, overlay1, subtext0, text, mauve, teal, peach.
# The default config's own comment block proves the mapping by filling each token with the
# matching Catppuccin value, sidebar_bg with mantle #181825, active_row_bg with base
# #1e1e2e, selection_bg with surface0 #313244, text with #cdd6f4. So every built in theme is
# that same vocabulary filled from the named theme's ramp, and Aura can join them because
# Aura publishes a ramp of exactly that shape in packages/vscode.
#
# sidebar_bg is deliberately absent. Omitting it leaves the spaces and agents panel on the
# terminal background, level with everything else. It was set to the ramp's mantle, which is
# correct on the dark half and was inverted on the light one, since mantle sits below the
# background and the light ramp runs downward, so the same offset lifted it instead. Both
# Catppuccin halves keep mantle below base, so lighter was wrong either way.
auto_switch = true
dark_name = "terminal"
light_name = "terminal"

[theme.custom.dark]
# Generated by theme-emit, do not edit these two tables. They are written from
# theme/palettes through dotfiles/herdr/theme-map by src/check-theme.sh, mode system.
# Change a colour in the palette or a role in the map and run the checker. Everything
# outside the two tables is written by hand and the generator copies it through.
accent = "#a277ff"
active_row_bg = "#29223b"
blue = "#82e2ff"
green = "#61ffca"
mauve = "#adadae"
overlay0 = "#adadae"
overlay1 = "#adadae"
panel_bg = "#15141b"
peach = "#ffca85"
red = "#ff6767"
selection_bg = "#3a2e56"
subtext0 = "#cdccce"
surface_dim = "#2d2c32"
surface0 = "#15141b"
surface1 = "#1b1a21"
teal = "#61ffca"
text = "#edecee"
yellow = "#ffca85"

[theme.custom.light]
accent = "#6b47b2"
active_row_bg = "#e8e7ec"
blue = "#005669"
green = "#00805f"
mauve = "#72717c"
overlay0 = "#72717c"
overlay1 = "#72717c"
panel_bg = "#f8f7fb"
peach = "#6b4400"
red = "#bf3239"
selection_bg = "#dcdbe1"
subtext0 = "#5c5a6a"
surface_dim = "#c6c5cd"
surface0 = "#f8f7fb"
surface1 = "#e8e7ec"
teal = "#00805f"
text = "#474556"
yellow = "#6b4400"

[keys]
prefix = "alt+z"

# Stated rather than left to the default. An earlier empty value unbound this, and
# deleting that line did not hand the key back, which a reload proves by accepting a
# custom command on prefix+g without reporting the conflict it reports when goto holds it.
goto = "prefix+g"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "alonz.command-palette.open"
description = "command palette"

[[keys.command]]
key = "prefix+alt+g"
type = "shell"
command = "\"$HERDR_BIN_PATH\" plugin pane open --plugin mdj-tools --entrypoint git"
description = "lazygit here, or pick a recent repository"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "\"$HERDR_BIN_PATH\" plugin pane open --plugin mdj-tools --entrypoint find"
description = "find a folder or file under home"

[[keys.command]]
key = "prefix+alt+f"
type = "shell"
command = "\"$HERDR_BIN_PATH\" plugin pane open --plugin mdj-tools --entrypoint browse"
description = "browse files with lf"
