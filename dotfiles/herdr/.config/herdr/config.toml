onboarding = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false

[ui.toast]
delivery = "terminal"

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[keys]
prefix = "alt+z"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "alonz.command-palette.open"
description = "command palette"
