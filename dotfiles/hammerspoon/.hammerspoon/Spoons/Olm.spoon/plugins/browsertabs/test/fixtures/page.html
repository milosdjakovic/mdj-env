<title>bttest page</title>
<style>body{font:14px system-ui;padding:2rem}</style>
<h1 id="h">bttest page</h1>
<p>A page this suite opened. It closes itself again when the suite finishes.</p>
<script>
  // The title comes from the address so one fixture can stand in for as many distinct pages as a
  // case needs, which matters because the tool is searched by title and two tabs with the same
  // title could not be told apart in a result.
  var t = new URLSearchParams(location.search).get("t") || "page";
  document.title = t;
  document.getElementById("h").textContent = t;
</script>
