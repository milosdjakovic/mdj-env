<title>bttest long</title>
<style>body{font:14px system-ui;padding:2rem}</style>
<h1>long title</h1>
<script>
  // A title long enough that Chrome elides the middle of the window name it reports over Apple
  // Events, replacing the middle with an ellipsis that appears in no accessibility title anywhere.
  // That is what broke matching on the window name alone, and it is why the tab title is tried
  // after it rather than instead of it.
  var t = new URLSearchParams(location.search).get("t") || "long";
  var filler = " Quarterly Planning And Delivery Addendum For The Combined Engineering Workstream";
  document.title = t + filler + filler + " Final";
</script>
