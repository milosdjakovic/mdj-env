# The default theme, the look Olm had before themes were files. Hand written, and every role
# that existed then keeps the value config/settings.lua held for it.
#
# theme-exempt, a hand chosen palette, the look this config has always had, so it is not painted from theme/palettes
#
# The chooser used to say this about its colours. One source for how the searchable chooser and
# its docked preview look in light and dark. The active side is picked per open from the live
# system appearance, so it tracks the automatic light and dark switch. The two row text colours
# were styledtext white values, since a styled row must restate its colour, and they are written
# here as the hex the same grey comes to, white 0.92 as ebebeb, 0.55 as 8c8c8c, 0.15 as 262626
# and 0.42 as 6b6b6b. Omit the light section to fall back to dark.
#
# A theme answers exactly eight roles and nothing else. foreground and subtext are the two text
# colours, background and border are the shared surface and its rules, and highlight is the bar
# under the list cursor, the tint behind selected text and the fill of a key chip, the white
# the kit used to derive for the cursor bar and the chip, written out as a hex over the page.
# primary, secondary and tertiary are the three accents, taken in order by graph series. They
# are hand chosen, a calm purple, green and orange that read on the half's own background,
# since this theme has no palette to take them from.

[dark]
foreground = "#ebebeb"
subtext    = "#8c8c8c"
background = "#29292e"
border     = "#59575c"
highlight  = "#454549"
primary    = "#a58be0"
secondary  = "#6fc7a0"
tertiary   = "#d9a066"

[light]
foreground = "#262626"
subtext    = "#6b6b6b"
background = "#cecace"
border     = "#a09f9f"
highlight  = "#bbb7bb"
primary    = "#6a4cb8"
secondary  = "#2f7d5c"
tertiary   = "#a35f1a"
